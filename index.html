<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KT1 접수 링크</title><style>:root{--bg:#f4f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#dbe3ef;--primary:#2563eb;--primary-dark:#1d4ed8;--soft:#eaf1ff}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#eaf2ff 0%,var(--bg) 240px)}.wrap{width:min(920px,100%);margin:auto;padding:20px 14px 60px}header{padding:18px 4px 16px}h1{margin:0;font-size:26px;letter-spacing:-.04em}.sub{margin-top:8px;color:var(--muted);font-size:14px}.toolbar{position:sticky;top:0;z-index:10;background:rgba(244,247,251,.92);backdrop-filter:blur(10px);padding:10px 0 12px;border-bottom:1px solid rgba(219,227,239,.7)}.miniBtns{display:flex;gap:8px}.miniBtns button{flex:1;border:1px solid var(--line);background:#fff;color:#334155;border-radius:12px;padding:10px;font-weight:700}.stats{margin:12px 4px 10px;color:var(--muted);font-size:13px}details{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden;box-shadow:0 10px 24px rgba(15,23,42,.05)}summary{list-style:none;cursor:pointer;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900;letter-spacing:-.03em;user-select:none}summary::-webkit-details-marker{display:none}.count{color:var(--primary);background:var(--soft);padding:5px 9px;border-radius:999px;font-size:12px;white-space:nowrap}details[data-group="아이폰 18 시리즈"] summary span:first-child,details[data-group="갤럭시 S26 시리즈"] summary span:first-child{color:#ed2024}.items{border-top:1px solid var(--line);padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid #edf1f7;border-radius:16px;padding:12px;background:#fbfdff}.model{font-size:15px;font-weight:900;letter-spacing:-.02em;margin-bottom:10px;word-break:break-all;text-align:left}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions.single{grid-template-columns:1fr}.btn{display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:12px;border:0;text-decoration:none;font-weight:900;font-size:14px;cursor:pointer}.open{background:var(--primary);color:#fff}.copy{background:#eef2f7;color:#1f2937}.divider{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:14px 2px 4px}.divider.first{margin-top:2px}.divider .label{font-size:12px;font-weight:800;color:var(--primary);background:var(--soft);border:1px solid #b8cdfb;border-radius:8px;padding:5px 9px;white-space:nowrap;letter-spacing:-.02em;box-shadow:0 1px 2px rgba(37,99,235,.06)}.divider .line{height:1px;background:#b8cdfb;flex:1}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:12px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:30;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}footer{margin-top:18px;color:#94a3b8;font-size:12px;text-align:center}@media(max-width:640px){.wrap{padding:16px 12px 44px}h1{font-size:23px}.items{grid-template-columns:1fr}summary{padding:15px 14px}}</style></head><body><div class="wrap"><header><h1>KT1 접수 링크</h1><div class="sub">필요한 기종을 펼쳐서 접수 링크를 열거나 복사하세요.</div></header><div class="toolbar"><div class="miniBtns"><button id="openAll">모두 펼치기</button><button id="closeAll">모두 접기</button></div></div><div class="stats" id="stats"></div><main id="list"></main><footer>KT1 링크 모음</footer></div><div class="toast" id="toast">복사 완료</div><script>const list=document.getElementById('list'),stats=document.getElementById('stats'),toast=document.getElementById('toast');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function iphoneLabel(group,model){const n=group.includes('18')?'18':group.includes('17')?'17':group.includes('16')?'16':group.includes('15')?'15':'';if(group==='아이폰 Air')return'아이폰 Air';if(model==='16E-256')return'아이폰16E';if(model.startsWith(`AIP${n}PS`))return`아이폰${n} PLUS`;if(model.startsWith(`AIP${n}PM`))return`아이폰${n} 프로맥스`;if(model.startsWith(`AIP${n}P`))return`아이폰${n} 프로`;if(model.startsWith(`AIP${n}-`))return`아이폰${n} 일반`;return''}function sLabel(group,model){if(group==='갤럭시 S23 시리즈'){if(model.startsWith('SM-S911'))return'S23 일반';if(model.startsWith('SM-S916'))return'S23 플러스';if(model.startsWith('SM-S918'))return'S23 울트라'}if(group==='갤럭시 S24 시리즈'){if(model.startsWith('SM-S921'))return'S24 일반';if(model.startsWith('SM-S926'))return'S24 플러스';if(model.startsWith('SM-S928'))return'S24 울트라';if(model.startsWith('SM-S721'))return'S24 FE'}if(group==='갤럭시 S25 시리즈'){if(model.startsWith('SM-S931'))return'S25 일반';if(model.startsWith('SM-S936'))return'S25 플러스';if(model.startsWith('SM-S938'))return'S25 울트라';if(model.startsWith('SM-S937'))return'S25 엣지';if(model.startsWith('SM-S731'))return'S25 FE'}if(group==='갤럭시 S26 시리즈'){if(model.startsWith('SM-S942'))return'S26 일반';if(model.startsWith('SM-S947'))return'S26 플러스';if(model.startsWith('SM-S948'))return'S26 울트라';if(model.startsWith('SM-S741'))return'S26 FE'}return''}function zLabel(group,model){if(group==='갤럭시 Z Flip 시리즈'){if(model.startsWith('SM-F731'))return'Z Flip5';if(model.startsWith('SM-F741'))return'Z Flip6';if(model.startsWith('SM-F761')||model.startsWith('SM-F766'))return'Z Flip7';if(model.startsWith('SM-F776'))return'Z Flip8'}if(group==='갤럭시 Z Fold 시리즈'){if(model.startsWith('SM-F946'))return'Z Fold5';if(model.startsWith('SM-F956'))return'Z Fold6';if(model.startsWith('SM-F966'))return'Z Fold7';if(model.startsWith('SM-F971')||model.startsWith('SM-F976'))return'Z Fold8'}return''}function divider(label,first){return`<div class="divider ${first?'first':''}"><span class="label">${esc(label)}</span><span class="line"></span></div>`}function sortIphone(group){const n=group.name.includes('18')?'18':group.name.includes('17')?'17':group.name.includes('16')?'16':group.name.includes('15')?'15':'';const rank=m=>{if(m==='16E-256')return 1;if(m.startsWith(`AIP${n}PS`))return 2;if(m.startsWith(`AIP${n}PM`))return 4;if(m.startsWith(`AIP${n}P`))return 3;return 0};group.items.sort((a,b)=>rank(a.model)-rank(b.model)||a.model.localeCompare(b.model))}function sortS(group){const order={"갤럭시 S23 시리즈":['S911','S916','S918'],"갤럭시 S24 시리즈":['S921','S926','S928','S721'],"갤럭시 S25 시리즈":['S931','S936','S938','S937','S731'],"갤럭시 S26 시리즈":['S942','S947','S948']}[group.name]||[];const rank=m=>{const i=order.findIndex(x=>m.includes(x));return i<0?99:i};group.items.sort((a,b)=>rank(a.model)-rank(b.model)||a.model.localeCompare(b.model))}function render(DATA){let html='',total=0;DATA.forEach(group=>{total+=group.items.length;html+=`<details data-group="${esc(group.name)}"><summary><span>${esc(group.name)}</span><span class="count">${group.items.length}개</span></summary><div class="items">`;let prev='';group.items.forEach(item=>{let label='';if(group.name.startsWith('아이폰'))label=iphoneLabel(group.name,item.model);else if(/^갤럭시 S2[3-6] 시리즈$/.test(group.name))label=sLabel(group.name,item.model);else label=zLabel(group.name,item.model);if(label&&label!==prev){html+=divider(label,!prev);prev=label}const hasUrl=!!item.url,copyVal=item.copyText||item.url,copyLabel=item.copyLabel||'링크 복사';html+=`<div class="item" data-model="${esc(item.model)}"><div class="model">${esc(item.model)}</div><div class="actions ${hasUrl?'':'single'}">${hasUrl?`<a class="btn open" href="${esc(item.url)}" target="_blank" rel="noopener">접수 열기</a>`:''}<button class="btn copy" data-copy="${esc(copyVal)}" data-kind="${item.copyText?'form':'url'}">${esc(copyLabel)}</button></div></div>`});html+='</div></details>'});list.innerHTML=html;stats.textContent=`총 ${total}개 / ${DATA.length}개 그룹`}function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}async function copyText(t,m){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}showToast(m)}document.addEventListener('click',e=>{const b=e.target.closest('.copy');if(b)copyText(b.dataset.copy,b.dataset.kind==='form'?'양식 복사 완료':'링크 복사 완료')});document.getElementById('openAll').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=true);document.getElementById('closeAll').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);const DATA=[{"name":"아이폰 18 시리즈","items":[{"model":"AIP18P-256","url":"http://online.kt.com/index.jsp?prdcID=589F503C-213A-4C75-B040-2D1FE6E3D1BA"},{"model":"AIP18P-512","url":"http://online.kt.com/index.jsp?prdcID=8280ED24-830C-4C94-9FEA-B04E6620959B"},{"model":"AIP18P-1T","url":"http://online.kt.com/index.jsp?prdcID=4208F2E8-D510-40A2-9F18-B3FD56C4C617"},{"model":"AIP18P-2T","url":"http://online.kt.com/index.jsp?prdcID=727C9CB2-0A6C-47D5-A58E-BDB4743C72B3"},{"model":"AIP18PM-256","url":"http://online.kt.com/index.jsp?prdcID=2863C12B-CAD9-4FFE-BC63-9754F1123AA8"},{"model":"AIP18PM-512","url":"http://online.kt.com/index.jsp?prdcID=87F3E88B-4A15-4AAA-9025-50996E4BAA05"},{"model":"AIP18PM-1T","url":"http://online.kt.com/index.jsp?prdcID=79A7E0F5-0689-4A19-B94E-A85437692EA6"},{"model":"AIP18PM-2T","url":"http://online.kt.com/index.jsp?prdcID=C082EE29-FCDD-4166-82CA-C050F69F2696"}]},{"name":"아이폰 17 시리즈","items":[{"model":"AIP17-256","url":"http://online.kt.com/index.jsp?prdcID=215CC35D-767B-48B6-8933-F96738C13ED5"},{"model":"AIP17-256-NEW","url":"http://online.kt.com/index.jsp?prdcID=33908AED-FB63-4C96-AD2F-DC2DC36CF0F0"},{"model":"AIP17-512","url":"http://online.kt.com/index.jsp?prdcID=60C1AB32-FA11-4A0B-AF74-6CBAA62F6E57"},{"model":"AIP17-512-NEW","url":"http://online.kt.com/index.jsp?prdcID=B8438178-66A9-4FF7-A44D-E0B8695317A2"},{"model":"AIP17P-256","url":"http://onlin
